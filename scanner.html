<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSWDO Client QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #173b63;
    }

    header {
      padding: 20px;
      background: #193d64;
      color: white;
      text-align: center;
    }

    main {
      max-width: 520px;
      margin: 30px auto;
      padding: 22px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px #00000012;
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    p {
      line-height: 1.5;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #193d64;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #777;
    }

    #status {
      padding: 12px;
      margin-top: 15px;
      background: #fff6dc;
      border: 1px solid #f0d27b;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }

    #result {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #e5f7eb;
      border: 1px solid #8dd6a4;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      main {
        margin: 15px;
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h2>CSWDO Client QR Scanner</h2>
    <div>City Social Welfare and Development Office</div>
  </header>

  <main>
    <h2>Scan Client Receipt</h2>

    <p>
      Allow camera access, then hold the client's CSWDO receipt
      QR code in front of the camera.
    </p>

    <div id="reader"></div>

    <div id="status">
      Press START CAMERA to begin scanning.
    </div>

    <div id="result">
      <strong>QR code detected</strong>
      <p id="qrText"></p>
      <button id="copyButton" type="button">COPY SCANNED TEXT</button>
    </div>

    <button id="startButton" type="button">START CAMERA</button>
    <button id="stopButton" class="secondary" type="button">
      STOP CAMERA
    </button>
    <button id="backButton" class="secondary" type="button">
      BACK
    </button>
  </main>

  <script>
    let scanner = null;
    let running = false;
    let lastResult = "";

    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");
    const qrText = document.getElementById("qrText");
    const startButton = document.getElementById("startButton");

    function setStatus(message) {
      statusBox.textContent = message;
    }

    async function startScanner() {
      if (running) return;

      if (!window.Html5Qrcode) {
        setStatus(
          "QR scanner library failed to load. Check your internet connection and reload this page."
        );
        return;
      }

      try {
        startButton.disabled = true;
        setStatus("Requesting camera access...");

        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("No camera was detected.");
        }

        const preferredCamera =
          cameras.find(camera =>
            /back|rear|environment/i.test(camera.label)
          ) || cameras[cameras.length - 1];

        await scanner.start(
          preferredCamera.id,
          {
            fps: 10,
            qrbox: { width: 240, height: 240 }
          },
          async function(decodedText) {
            if (decodedText === lastResult) return;

            lastResult = decodedText;
            qrText.textContent = decodedText;
            resultBox.style.display = "block";

            setStatus("QR code scanned successfully.");

            try {
              await scanner.stop();
            } catch (e) {}

            running = false;
            startButton.disabled = false;
          },
          function() {
            // No QR code detected in this video frame.
          }
        );

        running = true;
        setStatus("Camera is active. Point it at the client's QR code.");
      } catch (error) {
        running = false;
        startButton.disabled = false;

        setStatus(
          "Unable to start the camera: " +
          (error.message || error) +
          ". Check camera permission and close other apps using the camera."
        );
      }
    }

    async function stopScanner() {
      if (scanner && running) {
        try {
          await scanner.stop();
        } catch (error) {
          console.error(error);
        }
      }

      running = false;
      startButton.disabled = false;
      setStatus("Camera stopped.");
    }

    startButton.addEventListener("click", startScanner);

    document.getElementById("stopButton").addEventListener(
      "click",
      stopScanner
    );

    document.getElementById("copyButton").addEventListener(
      "click",
      async function() {
        try {
          await navigator.clipboard.writeText(lastResult);
          setStatus("Scanned text copied.");
        } catch (error) {
          setStatus("Please select and copy the scanned text manually.");
        }
      }
    );

    document.getElementById("backButton").addEventListener(
      "click",
      function() {
        if (document.referrer &&
            new URL(document.referrer).origin === location.origin) {
          history.back();
        } else {
          location.href = "./";
        }
      }
    );

    window.addEventListener("pagehide", function() {
      if (scanner && running) {
        scanner.stop().catch(function() {});
      }
    });
  </script>
</body>
</html>
